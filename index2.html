<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blocked IPs Dashboard</title>
    <style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #eef2f3;
        color: #333;
        margin: 0;
        padding: 0;
    }
    header {
        background-color: #0056b3;
        color: white;
        padding: 20px;
        text-align: center;
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
    }
    h1 {
        margin: 0;
        font-size: 1.8rem;
    }
    .container {
        max-width: 800px;
        margin: 20px auto;
        padding: 20px;
        background: white;
        border-radius: 10px;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
    }
    .button-container {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 20px;
    }
    button {
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        cursor: pointer;
        font-weight: bold;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    button:hover {
        transform: translateY(-2px);
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
    }
    .start-btn {
        background-color: #28a745;
        color: white;
    }
    .start-btn:hover {
        background-color: #218838;
    }
    .stop-btn {
        background-color: #dc3545;
        color: white;
    }
    .stop-btn:hover {
        background-color: #c82333;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        font-size: 0.9rem;
    }
    th, td {
        border: 1px solid #ddd;
        padding: 12px;
        text-align: center;
    }
    th {
        background-color: #007bff;
        color: white;
        font-weight: bold;
    }
    tr:nth-child(even) {
        background-color: #f9f9f9;
    }
    tr:hover {
        background-color: #f1f1f1;
    }
    .blinking {
        animation: blink 4s ease-in-out infinite; /* Slower animation for smoother effect */
    }
    @keyframes blink {
        0%, 100% {
            background-color: white;
            color: black;
        }
        50% {
            background-color: rgba(220, 0, 0, 0.6); /* Slight transparency for immersive effect */
            color: white;
        }
    }
    </style>

</head>
<body>
    <header>
        <h1>Blocked IPs Dashboard</h1>
    </header>
    <div class="container">
        <div class="button-container">
            <button class="start-btn" onclick="startDetection()">Start Detection</button>
            <button class="stop-btn" onclick="stopDetection()">Stop Detection</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Blocked IP</th>
                </tr>
            </thead>
            <tbody id="ip-list">
                <!-- Data will be inserted dynamically here -->
            </tbody>
        </table>
    </div>

    <script>
        async function startDetection() {
            try {
                const response = await fetch('/start_detection', { method: 'POST' });
                const data = await response.json();
                alert(data.message);
            } catch (error) {
                console.error('Error starting detection:', error);
            }
        }

        async function stopDetection() {
            try {
                const response = await fetch('/stop_detection', { method: 'POST' });
                const data = await response.json();
                alert(data.message);
            } catch (error) {
                console.error('Error stopping detection:', error);
            }
        }

        async function fetchBlockedIPs() {
            try {
                const response = await fetch('/blocked_ips');
                const data = await response.json();
                const ipList = document.getElementById('ip-list');
                ipList.innerHTML = ''; // Clear existing data

                data.blocked_ips.forEach((ip) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `<td>${data.blocked_ips.indexOf(ip) + 1}</td><td>${ip}</td>`;
                    if (data.blocked_ips.includes(ip)) {
                        row.classList.add('blinking');
                    }
                    ipList.appendChild(row);
                });
            } catch (error) {
                console.error('Error fetching blocked IPs:', error);
            }
        }

        // Fetch blocked IPs every second
        setInterval(fetchBlockedIPs, 1000);
    </script>
</body>
</html>
